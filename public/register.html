<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Query Chat</title><link rel="stylesheet" href="/style.css"></head><body class="auth-page"><main class="auth-card"><a class="back" href="/">← Query Chat</a><h1>Create your account</h1><p class="muted">Your account will be reviewed by the admin.</p><form id="register-form"><label>Full name<input name="name" required minlength="2" maxlength="80" placeholder="Your name"></label><label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<div class="password-wrap"><input id="register-password" name="password" type="password" required minlength="8" placeholder="At least 8 characters"><button class="password-toggle" type="button" data-password-toggle="register-password" aria-label="Show password" aria-pressed="false">Show</button></div></label><div id="error" class="alert" hidden></div><button class="btn primary full">Create account</button></form><p class="tiny">Already registered? <a href="/login">Log in</a></p></main><script src="/auth.js"></script></body></html>
